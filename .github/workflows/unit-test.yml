name: Unit Test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  linter-and-unit:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # `^` keeps the latest patch of each major while enforcing the
          # devEngines floor (>= 22.23.4 / 24.22.1 / 26.12.1).
          - "^22.23.4"
          - "^24.22.1"
          - "^26.12.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - name: Build project
        run: pnpm build

      - name: Unit test and save results
        env:
          TEST_REPORT: true
        run: pnpm run test:coverage

      - name: Upload test results
        if: ${{ !cancelled() && matrix.node-version == '^24.22.1' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results
          fail_ci_if_error: true

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.node-version == '^24.22.1' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/cobertura-coverage.xml
          fail_ci_if_error: true
