name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        description: Dry-Run
      prerelease:
        type: boolean
        description: Force prerelease
      graduate:
        type: boolean
        description: Force Conventional Graduate
      publish_only:
        type: boolean
        description: "Skip running `lerna version` and run publish-only retry (useful to retry failed publish)"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish packages
    # Only release from the main branch. This also blocks manual
    # `workflow_dispatch` runs (including `publish_only` retries) from any
    # other branch, since `github.ref` is the dispatched branch there.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize releases and never cancel an in-flight one: an interrupted
    # publish could leave npm and GitHub releases out of sync.
    concurrency:
      group: publish-packages
      cancel-in-progress: false
    # The `release` environment is the placeholder for required reviewers /
    # deployment branch protection rules, so every publish needs approval.
    environment: release
    steps:
      - name: Check if user is allowed to push new release
        if: ${{ github.actor != 'Mister-Hope' }}
        run: |
          echo "You are not allowed to push new release."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      - name: Linting check
        run: |
          pnpm run lint:check
          pnpm run lint:md

      - name: Test coverage
        run: pnpm run test:coverage

      - name: Config git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Lerna Version${{ inputs.dryrun == true && ' with dry run' || '' }}
        if: ${{ inputs.publish_only != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec lerna version ${{ inputs.dryrun == true && '--dry-run' || '' }} ${{ inputs.graduate == true && '--conventional-graduate' || inputs.prerelease == true && '--conventional-prerelease' || '' }} --yes

      - name: Publish packages${{ inputs.dryrun == true && ' with dry run' || '' }}
        run: |
          pnpm exec lerna publish from-package --force-publish --yes${{ inputs.dryrun == true && ' --dry-run' || '' }}

      - name: Sync npmmirror
        if: ${{ inputs.dryrun != true }}
        run: pnpm exec unrun scripts/sync.ts
