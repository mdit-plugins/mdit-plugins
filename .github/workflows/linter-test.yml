name: Build and Linter Test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  linter-and-unit:
    name: Linter test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.20.0

      - name: Install Deps
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      - name: Upload bundle analysis
        run: pnpm run bundle:analyze

      - name: Linter test
        run: |
          pnpm run lint:check
          pnpm run lint:md
